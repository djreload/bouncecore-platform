android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.suppressUnsupportedCompileSdk=36

# Debug builds use the public production domain by default for device testing.
# Release builds require -PBOUNCECORE_WEB_URL=<production-https-url>.
# Override debug builds with BOUNCECORE_DEBUG_WEB_URL when needed.
# Do not set BOUNCECORE_WEB_URL here unless this file is local-only.
# BOUNCECORE_WEB_URL=<https-url>
# BOUNCECORE_DEBUG_WEB_URL=<https-url>
# LEVELPLAY_APP_KEY=your-levelplay-app-key
# LEVELPLAY_BANNER_AD_UNIT_ID=your-banner-ad-unit-id
# LEVELPLAY_INTERSTITIAL_AD_UNIT_ID=your-interstitial-ad-unit-id
# LEVELPLAY_TEST_SUITE_ENABLED=true
# BOUNCECORE_VERSION_CODE=2
# BOUNCECORE_VERSION_NAME=1.0.1
#
# Release signing is normally supplied through environment variables or
# scripts/build-android-release.ps1 so passwords are not committed:
# BOUNCECORE_RELEASE_STORE_FILE=android-webview/release/bouncecore-release.jks
# BOUNCECORE_RELEASE_KEY_ALIAS=bouncecore
BOUNCECORE_DEBUG_WEB_URL=https://bouncecore.co.uk
LEVELPLAY_TEST_SUITE_ENABLED=false
