plugins {
    id "com.android.application"
}

def quoted(String value) {
    return "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

def configValue(String name, String fallback = "") {
    return providers.gradleProperty(name)
        .orElse(providers.environmentVariable(name))
        .orElse(fallback)
        .get()
}

def requiredConfigValue(String name) {
    def value = configValue(name).trim()
    if (!value) {
        throw new GradleException("${name} is required. Pass -P${name}=<https-url> or set it in a local Gradle property.")
    }

    return value
}

def normalizeHttpsWebUrl(String name, String value) {
    def normalized = value.trim().replaceAll('/+$', '')
    if (!normalized) {
        throw new GradleException("${name} is required.")
    }

    def uri
    try {
        uri = new URI(normalized)
    } catch (Exception ignored) {
        throw new GradleException("${name} must be a valid HTTPS URL.")
    }

    if (!"https".equalsIgnoreCase(uri.scheme) || !uri.host) {
        throw new GradleException("${name} must be a valid HTTPS URL.")
    }

    return normalized
}

def rejectReleaseWebUrl(String name, String value) {
    def normalized = normalizeHttpsWebUrl(name, value)
    def host = new URI(normalized).host.toLowerCase(Locale.ROOT)
    def isLocalHost = host == "localhost" || host == "127.0.0.1" || host == "::1"
    def isPrivateHost = host.startsWith("10.") || host.startsWith("192.168.") || host ==~ /^172\.(1[6-9]|2[0-9]|3[0-1])\..*/
    def isPlaceholderHost = host == "your-domain.example" || host.endsWith(".example")
    def isStagingHost = host.startsWith("develop.") || host.startsWith("staging.")

    if (isLocalHost || isPrivateHost || isPlaceholderHost || isStagingHost) {
        throw new GradleException("${name} must point to the public production HTTPS site for release builds, not a local, placeholder, or staging host.")
    }

    return normalized
}

def releaseStoreFilePath = configValue("BOUNCECORE_RELEASE_STORE_FILE")
def releaseStorePassword = configValue("BOUNCECORE_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = configValue("BOUNCECORE_RELEASE_KEY_ALIAS")
def releaseKeyPassword = configValue("BOUNCECORE_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def debugWebUrl = normalizeHttpsWebUrl(
    "BOUNCECORE_DEBUG_WEB_URL",
    configValue("BOUNCECORE_DEBUG_WEB_URL", configValue("BOUNCECORE_WEB_URL", "https://develop.k-nrg.co.uk"))
)
def configuredReleaseWebUrl = configValue("BOUNCECORE_WEB_URL").trim()
def releaseBuildConfigWebUrl = configuredReleaseWebUrl ? configuredReleaseWebUrl.replaceAll('/+$', '') : "https://release-url-required.invalid"

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase(Locale.ROOT).contains("release") }) {
        rejectReleaseWebUrl("BOUNCECORE_WEB_URL", configuredReleaseWebUrl)
    }
}

android {
    namespace "uk.co.bouncecore.app"
    compileSdk 36

    defaultConfig {
        applicationId "uk.co.bouncecore.app"
        minSdk 23
        targetSdk 36
        versionCode configValue("BOUNCECORE_VERSION_CODE", "1").toInteger()
        versionName configValue("BOUNCECORE_VERSION_NAME", "1.0.0")

        buildConfigField "String", "UNITY_PROJECT_ID", quoted("61d46651-d0a2-4175-ade1-fc300e58559f")
        buildConfigField "String", "LEVELPLAY_APP_KEY", quoted(configValue("LEVELPLAY_APP_KEY"))
        buildConfigField "String", "LEVELPLAY_BANNER_AD_UNIT_ID", quoted(configValue("LEVELPLAY_BANNER_AD_UNIT_ID"))
        buildConfigField "String", "LEVELPLAY_INTERSTITIAL_AD_UNIT_ID", quoted(configValue("LEVELPLAY_INTERSTITIAL_AD_UNIT_ID"))
        buildConfigField "boolean", "LEVELPLAY_TEST_SUITE_ENABLED", configValue("LEVELPLAY_TEST_SUITE_ENABLED", "false").toBoolean().toString()
        buildConfigField "String", "FIREBASE_ANDROID_API_KEY", quoted(configValue("FIREBASE_ANDROID_API_KEY"))
        buildConfigField "String", "FIREBASE_ANDROID_APP_ID", quoted(configValue("FIREBASE_ANDROID_APP_ID"))
        buildConfigField "String", "FIREBASE_MESSAGING_SENDER_ID", quoted(configValue("FIREBASE_MESSAGING_SENDER_ID"))
        buildConfigField "String", "FIREBASE_PROJECT_ID", quoted(configValue("FIREBASE_PROJECT_ID"))
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "BOUNCECORE_WEB_URL", quoted(debugWebUrl)
        }

        release {
            buildConfigField "String", "BOUNCECORE_WEB_URL", quoted(releaseBuildConfigWebUrl)
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.unity3d.ads-mediation:mediation-sdk:9.4.0"
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.android.gms:play-services-appset:16.0.0"
    implementation "com.google.android.gms:play-services-ads-identifier:18.1.0"
    implementation "com.google.android.gms:play-services-basement:18.1.0"
}
