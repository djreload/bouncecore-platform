name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bouncecore_ci
          POSTGRES_PASSWORD: bouncecore_ci_password
          POSTGRES_USER: bouncecore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bouncecore_ci -d bouncecore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bouncecore_ci:bouncecore_ci_password@127.0.0.1:5432/bouncecore_ci
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      STREAM_PROVIDER: mock
      RTMP_INGEST_URL: rtmp://example.test/live?user=bouncecore&pass={streamKey}
      PUBLIC_PLAYBACK_URL: https://example.test/hls/live.m3u8
      TRANSCODER_HLS_PUBLIC_URL: https://example.test/hls/live/master.m3u8
      TENOR_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate maintenance script syntax
        run: |
          bash -n scripts/install-instance.sh
          bash -n scripts/backup-instance.sh
          bash -n scripts/restore-instance.sh
