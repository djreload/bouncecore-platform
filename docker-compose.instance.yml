services:
  postgres:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER:-bouncecore-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bouncecore_platform}
      POSTGRES_USER: ${POSTGRES_USER:-bouncecore_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bouncecore_app} -d ${POSTGRES_DB:-bouncecore_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ${REDIS_CONTAINER:-bouncecore-redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-bouncecore-platform}:${APP_IMAGE_TAG:-instance}
    container_name: ${APP_CONTAINER:-bouncecore-app}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.instance
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/public/uploads

  stream-core:
    profiles:
      - stream-core
    image: ${APP_IMAGE:-bouncecore-platform}:${APP_IMAGE_TAG:-instance}
    container_name: ${STREAM_CORE_CONTAINER:-bouncecore-stream-core}
    restart: unless-stopped
    env_file:
      - .env.instance
    environment:
      STREAM_CORE_HTTP_HOST: 0.0.0.0
      STREAM_CORE_HTTP_PORT: 8088
      STREAM_CORE_STATE_FILE: /data/state.json
      STREAM_CORE_KEY_VALIDATION_URL: http://app:3000/internal/stream/keys/validate
      STREAM_CORE_KEY_VALIDATION_TOKEN: ${INTERNAL_TASK_TOKEN:?INTERNAL_TASK_TOKEN is required}
      MEDIA_GATEWAY_API_URL: http://media-gateway:9997
    command: ["npm", "run", "stream-core"]
    ports:
      - "${STREAM_CORE_BIND_HOST:-127.0.0.1}:${STREAM_CORE_HTTP_BIND_PORT:-18088}:8088"
    volumes:
      - stream_core_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  media-gateway:
    profiles:
      - media-gateway
    image: bluenviron/mediamtx:1.19.0
    container_name: ${MEDIA_GATEWAY_CONTAINER:-bouncecore-media-gateway}
    restart: unless-stopped
    depends_on:
      stream-core:
        condition: service_healthy
    environment:
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: http://stream-core:8088/api/mediamtx/auth?token=${STREAM_CORE_INTERNAL_TOKEN:?STREAM_CORE_INTERNAL_TOKEN is required}
      MTX_API: "true"
      MTX_APIADDRESS: :9997
      MTX_RTSP: "false"
      MTX_RTMP: "true"
      MTX_RTMPENCRYPTION: ${MEDIA_GATEWAY_RTMP_ENCRYPTION:-no}
      MTX_RTMPADDRESS: :1935
      MTX_RTMPSADDRESS: :1936
      MTX_RTMPSERVERKEY: /certs/server.key
      MTX_RTMPSERVERCERT: /certs/server.crt
      MTX_HLS: "true"
      MTX_HLSADDRESS: :8888
      MTX_HLSALLOWORIGINS: "*"
      MTX_WEBRTC: "false"
      MTX_SRT: "false"
      MTX_MOQ: "false"
    ports:
      - "${MEDIA_GATEWAY_RTMP_BIND_HOST:-127.0.0.1}:${MEDIA_GATEWAY_RTMP_BIND_PORT:-1935}:1935"
      - "${MEDIA_GATEWAY_RTMPS_BIND_HOST:-127.0.0.1}:${MEDIA_GATEWAY_RTMPS_BIND_PORT:-1936}:1936"
      - "${MEDIA_GATEWAY_HLS_BIND_HOST:-127.0.0.1}:${MEDIA_GATEWAY_HLS_BIND_PORT:-18888}:8888"
    volumes:
      - "${MEDIA_GATEWAY_RTMPS_CERT_DIR:-./.instance-certs/rtmps}:/certs:ro"

  hls-origin:
    profiles:
      - transcoder
    image: nginx:1.27-alpine
    container_name: ${HLS_ORIGIN_CONTAINER:-bouncecore-hls-origin}
    restart: unless-stopped
    ports:
      - "${TRANSCODER_HLS_BIND_HOST:-127.0.0.1}:${TRANSCODER_HLS_BIND_PORT:-18889}:80"
    volumes:
      - transcoder_hls_data:/usr/share/nginx/html:ro
      - ./deploy/nginx/hls-origin.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  media-transcoder:
    profiles:
      - transcoder
    image: jrottenberg/ffmpeg:7.1-alpine
    container_name: ${TRANSCODER_CONTAINER:-bouncecore-media-transcoder}
    restart: unless-stopped
    depends_on:
      media-gateway:
        condition: service_started
    environment:
      STREAM_CORE_INTERNAL_TOKEN: ${STREAM_CORE_INTERNAL_TOKEN:?STREAM_CORE_INTERNAL_TOKEN is required}
      TRANSCODER_SOURCE_URL: http://stream-core:8088/api/transcoder/source
    entrypoint:
      - /bin/sh
      - -lc
      - |
        while true; do
          source_url="$$(wget -q -T 5 -O - --header "Authorization: Bearer $$STREAM_CORE_INTERNAL_TOKEN" "$$TRANSCODER_SOURCE_URL" 2>/dev/null || true)"
          if [ -z "$$source_url" ]; then
            sleep 2
            continue
          fi
          rm -rf /hls/live
          mkdir -p /hls/live/240p /hls/live/480p /hls/live/720p
          ffmpeg -hide_banner -loglevel warning \
            -fflags +genpts+discardcorrupt -thread_queue_size 1024 -i "$$source_url" \
            -filter_complex "[0:v]split=3[v240][v480][v720];[v240]scale=w=426:h=240:force_original_aspect_ratio=decrease,pad=426:240:(ow-iw)/2:(oh-ih)/2[v240out];[v480]scale=w=854:h=480:force_original_aspect_ratio=decrease,pad=854:480:(ow-iw)/2:(oh-ih)/2[v480out];[v720]scale=w=1280:h=720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2[v720out]" \
            -map "[v240out]" -map 0:a:0 \
            -map "[v480out]" -map 0:a:0 \
            -map "[v720out]" -map 0:a:0 \
            -c:v libx264 -preset veryfast -g 60 -sc_threshold 0 \
            -c:a aac -ar 48000 \
            -b:v:0 500k -maxrate:v:0 535k -bufsize:v:0 1000k -b:a:0 96k \
            -b:v:1 1200k -maxrate:v:1 1284k -bufsize:v:1 2400k -b:a:1 128k \
            -b:v:2 3000k -maxrate:v:2 3210k -bufsize:v:2 6000k -b:a:2 160k \
            -f hls -hls_time 2 -hls_list_size 8 -hls_delete_threshold 6 -hls_allow_cache 0 \
            -hls_flags delete_segments+independent_segments+omit_endlist+program_date_time \
            -hls_start_number_source epoch -hls_segment_type mpegts -master_pl_name master.m3u8 \
            -var_stream_map "v:0,a:0,name:240p v:1,a:1,name:480p v:2,a:2,name:720p" \
            -hls_segment_filename "/hls/live/%v/segment_%010d.ts" \
            "/hls/live/%v/index.m3u8" || true
          sleep 3
        done
    volumes:
      - transcoder_hls_data:/hls

  media-restreamer:
    profiles:
      - restream
    image: jrottenberg/ffmpeg:7.1-alpine
    container_name: ${RESTREAMER_CONTAINER:-bouncecore-media-restreamer}
    restart: unless-stopped
    environment:
      INTERNAL_TASK_TOKEN: ${INTERNAL_TASK_TOKEN:?INTERNAL_TASK_TOKEN is required}
      STREAM_CORE_INTERNAL_TOKEN: ${STREAM_CORE_INTERNAL_TOKEN:?STREAM_CORE_INTERNAL_TOKEN is required}
      RESTREAM_SOURCE_URL: http://stream-core:8088/api/restream/source
      RESTREAM_TARGET_URL: http://app:3000/internal/stream/restream-target
      RESTREAM_TRANSCODE: ${RESTREAM_TRANSCODE:-true}
      RESTREAM_VIDEO_FPS: ${RESTREAM_VIDEO_FPS:-30}
      RESTREAM_KEYFRAME_SECONDS: ${RESTREAM_KEYFRAME_SECONDS:-2}
      RESTREAM_VIDEO_BITRATE: ${RESTREAM_VIDEO_BITRATE:-4500k}
      RESTREAM_VIDEO_MAXRATE: ${RESTREAM_VIDEO_MAXRATE:-5000k}
      RESTREAM_VIDEO_BUFSIZE: ${RESTREAM_VIDEO_BUFSIZE:-9000k}
      RESTREAM_AUDIO_BITRATE: ${RESTREAM_AUDIO_BITRATE:-160k}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        fetch_source() {
          wget -q -T 5 -O - --header "Authorization: Bearer $$STREAM_CORE_INTERNAL_TOKEN" "$$RESTREAM_SOURCE_URL" 2>/dev/null || true
        }
        fetch_target() {
          wget -q -T 5 -O - --header "Authorization: Bearer $$INTERNAL_TASK_TOKEN" "$$RESTREAM_TARGET_URL" 2>/dev/null || true
        }
        while true; do
          source_url="$$(fetch_source)"
          target_url="$$(fetch_target)"
          if [ -z "$$source_url" ] || [ -z "$$target_url" ]; then
            sleep 5
            continue
          fi
          echo "Starting external restream output."
          if [ "$${RESTREAM_TRANSCODE:-true}" = "false" ]; then
            ffmpeg -hide_banner -loglevel warning -re -i "$$source_url" -c copy -f flv "$$target_url" &
          else
            restream_gop="$$(($$RESTREAM_VIDEO_FPS * $$RESTREAM_KEYFRAME_SECONDS))"
            ffmpeg -hide_banner -loglevel warning -re \
              -fflags +genpts+discardcorrupt -thread_queue_size 1024 -i "$$source_url" \
              -map 0:v:0 -map 0:a:0? \
              -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p \
              -r "$$RESTREAM_VIDEO_FPS" -g "$$restream_gop" -keyint_min "$$restream_gop" -sc_threshold 0 \
              -force_key_frames "expr:gte(t,n_forced*$$RESTREAM_KEYFRAME_SECONDS)" \
              -b:v "$$RESTREAM_VIDEO_BITRATE" -maxrate "$$RESTREAM_VIDEO_MAXRATE" -bufsize "$$RESTREAM_VIDEO_BUFSIZE" \
              -c:a aac -ar 48000 -b:a "$$RESTREAM_AUDIO_BITRATE" \
              -f flv "$$target_url" &
          fi
          restream_pid="$$!"
          while kill -0 "$$restream_pid" 2>/dev/null; do
            sleep 10
            next_source_url="$$(fetch_source)"
            next_target_url="$$(fetch_target)"
            if [ "$$next_source_url" != "$$source_url" ] || [ "$$next_target_url" != "$$target_url" ]; then
              echo "Restream source or target changed; restarting output."
              kill "$$restream_pid" 2>/dev/null || true
              wait "$$restream_pid" 2>/dev/null || true
              break
            fi
          done
          wait "$$restream_pid" 2>/dev/null || true
          sleep 2
        done

  core-fps:
    profiles:
      - core-fps
    build:
      context: ./services/core-fps/runtime
      dockerfile: Dockerfile
    image: ${CORE_FPS_IMAGE:-bouncecore-core-fps}:${CORE_FPS_IMAGE_TAG:-v0.2.5}
    container_name: ${CORE_FPS_CONTAINER:-bouncecore-core-fps}
    restart: unless-stopped
    cpus: ${CORE_FPS_CPU_LIMIT:-2.0}
    mem_limit: ${CORE_FPS_MEMORY_LIMIT:-2g}
    pids_limit: ${CORE_FPS_PIDS_LIMIT:-256}
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - core_fps_cache:/var/cache/sour

  core-fps-telemetry:
    profiles:
      - core-fps
    build:
      context: ./services/core-fps/telemetry
      dockerfile: Dockerfile
    image: ${CORE_FPS_TELEMETRY_IMAGE:-bouncecore-core-fps-telemetry}:${CORE_FPS_TELEMETRY_IMAGE_TAG:-v1}
    container_name: ${CORE_FPS_TELEMETRY_CONTAINER:-bouncecore-core-fps-telemetry}
    restart: unless-stopped
    cpus: ${CORE_FPS_TELEMETRY_CPU_LIMIT:-0.50}
    mem_limit: ${CORE_FPS_TELEMETRY_MEMORY_LIMIT:-128m}
    pids_limit: ${CORE_FPS_TELEMETRY_PIDS_LIMIT:-128}
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_started
      core-fps:
        condition: service_healthy
    environment:
      CORE_FPS_RUNTIME_WS_URL: ws://core-fps:1337/ws/
      CORE_FPS_TELEMETRY_SECRET: ${CORE_FPS_TELEMETRY_SECRET:-not-configured}
      CORE_FPS_TELEMETRY_URL: http://app:3000/api/internal/games/core/telemetry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1338/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      retries: 8

  core-fps-gateway:
    profiles:
      - core-fps
    image: nginx:1.27-alpine
    container_name: ${CORE_FPS_GATEWAY_CONTAINER:-bouncecore-core-fps-gateway}
    restart: unless-stopped
    cpus: ${CORE_FPS_GATEWAY_CPU_LIMIT:-0.50}
    mem_limit: ${CORE_FPS_GATEWAY_MEMORY_LIMIT:-256m}
    pids_limit: ${CORE_FPS_GATEWAY_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_started
      core-fps:
        condition: service_healthy
      core-fps-telemetry:
        condition: service_healthy
    environment:
      CORE_FPS_APP_UPSTREAM: app:3000
      CORE_FPS_GATEWAY_SHARED_SECRET: ${CORE_FPS_GATEWAY_SHARED_SECRET:-not-configured}
      CORE_FPS_PARENT_ORIGIN: ${CORE_FPS_PARENT_ORIGIN:-https://bouncecore.example.com}
      CORE_FPS_RUNTIME_UPSTREAM: core-fps:1337
      CORE_FPS_WEBSOCKET_UPSTREAM: core-fps-telemetry:1338
    ports:
      - "${CORE_FPS_GATEWAY_BIND_HOST:-127.0.0.1}:${CORE_FPS_GATEWAY_PORT:-18443}:8080"
    volumes:
      - ./services/core-fps/gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    profiles:
      - worker
    image: ${APP_IMAGE:-bouncecore-platform}:${APP_IMAGE_TAG:-instance}
    container_name: ${WORKER_CONTAINER:-bouncecore-worker}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.instance
    command: ["npm", "run", "worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bouncecore-worker-heartbeat && find /tmp/bouncecore-worker-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-bouncecore_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME:-bouncecore_redis_data}
  uploads_data:
    name: ${UPLOADS_VOLUME:-bouncecore_uploads}
  stream_core_data:
    name: ${STREAM_CORE_VOLUME:-bouncecore_stream_core_data}
  transcoder_hls_data:
    name: ${TRANSCODER_HLS_VOLUME:-bouncecore_transcoder_hls}
  core_fps_cache:
    name: ${CORE_FPS_CACHE_VOLUME:-bouncecore_core_fps_cache}
