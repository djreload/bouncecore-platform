services:
  postgres:
    image: postgres:18-alpine
    container_name: bouncecore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bouncecore_platform}
      POSTGRES_USER: ${POSTGRES_USER:-bouncecore_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bouncecore_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bouncecore_app} -d ${POSTGRES_DB:-bouncecore_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: bouncecore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - bouncecore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bouncecore-platform:staging
    container_name: bouncecore-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - bouncecore_uploads:/app/public/uploads

  stream-core:
    profiles:
      - stream-core
    image: bouncecore-platform:staging
    container_name: bouncecore-stream-core
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      STREAM_CORE_HTTP_HOST: 0.0.0.0
      STREAM_CORE_HTTP_PORT: 8088
      STREAM_CORE_STATE_FILE: /data/state.json
      STREAM_CORE_KEY_VALIDATION_URL: http://app:3000/internal/stream/keys/validate
      STREAM_CORE_KEY_VALIDATION_TOKEN: ${INTERNAL_TASK_TOKEN:?INTERNAL_TASK_TOKEN is required}
    command: ["npm", "run", "stream-core"]
    ports:
      - "127.0.0.1:${STREAM_CORE_HTTP_BIND_PORT:-18088}:8088"
    volumes:
      - bouncecore_stream_core_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  media-gateway:
    profiles:
      - media-gateway
    image: bluenviron/mediamtx:1.19.0
    container_name: bouncecore-media-gateway
    restart: unless-stopped
    depends_on:
      stream-core:
        condition: service_healthy
    environment:
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: http://stream-core:8088/api/mediamtx/auth?token=${STREAM_CORE_INTERNAL_TOKEN:?STREAM_CORE_INTERNAL_TOKEN is required}
      MTX_RTSP: "false"
      MTX_RTMP: "true"
      MTX_RTMPADDRESS: :1935
      MTX_HLS: "true"
      MTX_HLSADDRESS: :8888
      MTX_HLSALLOWORIGINS: "*"
      MTX_WEBRTC: "false"
      MTX_SRT: "false"
      MTX_MOQ: "false"
    ports:
      - "127.0.0.1:${MEDIA_GATEWAY_RTMP_BIND_PORT:-1935}:1935"
      - "127.0.0.1:${MEDIA_GATEWAY_HLS_BIND_PORT:-18888}:8888"

  hls-origin:
    profiles:
      - transcoder
    image: nginx:1.27-alpine
    container_name: bouncecore-hls-origin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRANSCODER_HLS_BIND_PORT:-18889}:80"
    volumes:
      - bouncecore_transcoder_hls:/usr/share/nginx/html:ro
      - ./deploy/nginx/hls-origin.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  media-transcoder:
    profiles:
      - transcoder
    image: jrottenberg/ffmpeg:7.1-alpine
    container_name: bouncecore-media-transcoder
    restart: unless-stopped
    depends_on:
      media-gateway:
        condition: service_started
    environment:
      TRANSCODER_INPUT_URL: ${TRANSCODER_INPUT_URL:-rtmp://media-gateway:1935/live}
    entrypoint:
      - sh
      - -lc
      - |
        while true; do
          rm -rf /hls/live
          mkdir -p /hls/live/240p /hls/live/480p /hls/live/720p
          ffmpeg -hide_banner -loglevel warning \
            -i "$$TRANSCODER_INPUT_URL" \
            -filter_complex "[0:v]split=3[v240][v480][v720];[v240]scale=w=426:h=240:force_original_aspect_ratio=decrease,pad=426:240:(ow-iw)/2:(oh-ih)/2[v240out];[v480]scale=w=854:h=480:force_original_aspect_ratio=decrease,pad=854:480:(ow-iw)/2:(oh-ih)/2[v480out];[v720]scale=w=1280:h=720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2[v720out]" \
            -map "[v240out]" -map 0:a:0 \
            -map "[v480out]" -map 0:a:0 \
            -map "[v720out]" -map 0:a:0 \
            -c:v libx264 -preset veryfast -g 60 -sc_threshold 0 \
            -c:a aac -ar 48000 \
            -b:v:0 500k -maxrate:v:0 535k -bufsize:v:0 1000k -b:a:0 96k \
            -b:v:1 1200k -maxrate:v:1 1284k -bufsize:v:1 2400k -b:a:1 128k \
            -b:v:2 3000k -maxrate:v:2 3210k -bufsize:v:2 6000k -b:a:2 160k \
            -f hls -hls_time 2 -hls_list_size 8 -hls_flags delete_segments+independent_segments \
            -hls_segment_type fmp4 -master_pl_name master.m3u8 \
            -var_stream_map "v:0,a:0,name:240p v:1,a:1,name:480p v:2,a:2,name:720p" \
            -hls_segment_filename "/hls/live/%v/segment_%05d.m4s" \
            "/hls/live/%v/index.m3u8" || true
          sleep 3
        done
    volumes:
      - bouncecore_transcoder_hls:/hls

  worker:
    profiles:
      - worker
    image: bouncecore-platform:staging
    container_name: bouncecore-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    command: ["npm", "run", "worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bouncecore-worker-heartbeat && find /tmp/bouncecore-worker-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  bouncecore_postgres_data:
  bouncecore_redis_data:
  bouncecore_uploads:
  bouncecore_stream_core_data:
  bouncecore_transcoder_hls:
