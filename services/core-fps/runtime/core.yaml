server:
  assets:
    - "fs:/opt/core/assets/.index.source"
  cacheDirectory: "/var/cache/sour"
  presets:
    - name: "default"
      default: true
      config:
        defaultMode: "ffa"
        defaultMap: "blocklands"
        maps:
          - "blocklands"
          - "turbine"
          - "complex"
          - "dust2"
          - "xmwhub"
    - name: "ffa"
      config:
        defaultMode: "ffa"
        defaultMap: "blocklands"
        maps:
          - "blocklands"
          - "turbine"
          - "complex"
          - "dust2"
          - "xmwhub"
    - name: "insta"
      config:
        defaultMode: "insta"
        defaultMap: "blocklands"
        maps:
          - "blocklands"
          - "turbine"
          - "complex"
          - "dust2"
          - "xmwhub"
    - name: "team-deathmatch"
      config:
        defaultMode: "teamplay"
        defaultMap: "blocklands"
        maps:
          - "blocklands"
          - "turbine"
          - "complex"
          - "dust2"
          - "xmwhub"
    - name: "capture-the-flag"
      config:
        defaultMode: "ctf"
        defaultMap: "blocklands"
        maps:
          - "blocklands"
          - "dust2"
          - "xmwhub"
  spaces:
    - preset: "ffa"
      votingCreates: false
      config:
        alias: "lobby"
    - preset: "insta"
      config:
        alias: "insta"
    - preset: "team-deathmatch"
      votingCreates: false
      config:
        alias: "lobby-tdm"
    - preset: "capture-the-flag"
      votingCreates: false
      config:
        alias: "lobby-ctf"
  ingress:
    desktop: []
    web:
      address: "0.0.0.0"
      port: 1337
client:
  menuOptions: "guibutton \"Play Bouncecore arena\" \"join lobby\""
