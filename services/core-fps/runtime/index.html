<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <title>Bouncecore Core</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Emscripten's generated engine scripts require these globals before
      // the React client starts importing the game runtime.
      var Module = typeof Module !== "undefined" ? Module : {};
      Module.preInit = [];
      Module.preRun = [];
      Module.noInitialRun = true;
      Module.postRun = [];
      var WASM_PROMISE_RESOLVE = null;
      var WASM_PROMISE = new Promise((resolve) => {
        WASM_PROMISE_RESOLVE = resolve;
      });
    </script>
    <script src="/index.js"></script>
    <script async src="/game/api.js"></script>
    <script async src="/game/sauerbraten.js"></script>
  </body>
</html>
